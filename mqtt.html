<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能鱼塘投喂系统</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    margin-top: 30px;
    font-family: Arial, sans-serif;
  }
  /* 设备下拉容器 */
  .device-select-wrap {
    width: 360px;
  }
  #deviceSelect {
    width: 100%;
    height: 160px;
    font-size: 44px;
    border: none;
    border-radius: 20px;
    color: white;
    cursor: pointer;
    background: #34495e;
    padding: 0 20px;
    /* 去掉下拉默认样式 */
    appearance: none;
    -webkit-appearance: none;
    position: relative;
  }
  /* 下拉箭头自定义 */
  .device-select-wrap {
    position: relative;
  }
  .device-select-wrap::after {
    content: "▼";
    color: #fff;
    font-size: 40px;
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* 连接状态显示区域样式 */
  .status-box {
    width: 400px;
    height: 80px;
    line-height: 80px;
    text-align: center;
    border-radius: 15px;
    font-size: 28px;
    font-weight: bold;
    color: white;
  }
  .disconnected {
    background: #e74c3c;
  }
  .connected {
    background: #2ecc71;
  }
  /* 投喂按钮容器 */
  .btn-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
  }
  /* 投喂按钮 */
  button {
    width: 360px;
    height: 160px;
    font-size: 44px;
    border: none;
    border-radius: 20px;
    color: white;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-5s { background: #3498db; }
  .btn-10s { background: #9b59b6; }
  .btn-15s { background: #1abc9c; }
  .btn-30s { background: #f39c12; }
  .btn-60s { background: #e67e22; }
  .btn-120s { background: #8e44ad; }
  button:active {
    opacity: 0.8;
  }
</style>
</head>
<body>
  <!-- 设备下拉选择，尺寸和投喂按钮一致 -->
  <div class="device-select-wrap">
    <select id="deviceSelect">
      <option value="/chenyongzhe">设备1 /chenyongzhe</option>
      <option value="/chenyongzhe2">设备2 /chenyongzhe2</option>
    </select>
  </div>

  <!-- 连接状态显示区域 -->
  <div id="status" class="status-box disconnected">MQTT 未连接</div>
  <!-- 投喂按钮容器 -->
  <div class="btn-container">
    <button class="btn-5s" data-msg="w">投喂5秒</button>
    <button class="btn-10s" data-msg="t">投喂10秒</button>
    <button class="btn-15s" data-msg="s">投喂15秒</button>
    <button class="btn-30s" data-msg="b">投喂30秒</button>
    <button class="btn-60s" data-msg="y">投喂60秒</button>
    <button class="btn-120s" data-msg="l">投喂120秒</button>
  </div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
// MQTT连接配置
const client = mqtt.connect('wss://w9196d9a.ala.cn-shenzhen.emqxsl.cn:8084/mqtt', {
  clientId: "web_" + Math.random().toString(16),
  username: "chenyongzhe",
  password: "cyz123456"
})
let currentTopic = '/chenyongzhe' // 默认设备1

const statusElement = document.getElementById('status')
const deviceSelect = document.getElementById('deviceSelect')

// 下拉切换事件
deviceSelect.addEventListener('change', function () {
  currentTopic = this.value
  console.log("已切换设备，当前MQTT主题：", currentTopic)
})

// MQTT连接成功
client.on('connect', function () {
  statusElement.textContent = 'MQTT 已连接'
  statusElement.className = 'status-box connected'
})
// MQTT断开
client.on('close', function () {
  statusElement.textContent = 'MQTT 已断开'
  statusElement.className = 'status-box disconnected'
})
// MQTT错误
client.on('error', function (err) {
  statusElement.textContent = 'MQTT 连接失败'
  statusElement.className = 'status-box disconnected'
  console.error('MQTT错误：', err)
})

// 投喂按钮点击事件
document.querySelectorAll('.btn-container button').forEach(btn => {
  btn.addEventListener('click', function () {
    if (client.connected) {
      const msg = this.getAttribute('data-msg')
      client.publish(currentTopic, msg)
      const originalText = this.textContent
      this.textContent = `已发送`
      setTimeout(() => {
        this.textContent = originalText
      }, 1000)
    } else {
      alert('MQTT未连接，无法发送指令！')
    }
  })
})
</script>
</body>
</html>
